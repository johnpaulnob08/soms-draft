version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sacdev_backend
    ports:
      - "5000:5000"        # Expose backend API on host port 5000
    env_file:
      - .env               # Loads GMAIL_APP_PASSWORD from .env file
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    restart: unless-stopped
    networks:
      - sacdev_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sacdev_frontend
    ports:
      - "80:80"            # Expose frontend on standard HTTP port 80
    depends_on:
      - backend             # Ensure backend starts first
    restart: unless-stopped
    networks:
      - sacdev_network

networks:
  sacdev_network:
    driver: bridge